AWSTemplateFormatVersion: '2010-09-09'
Description: Private encrypted activity originals and photos
Resources:
  ActivityFiles:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  EnforceTls:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ActivityFiles
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ActivityFiles.Arn
              - !Sub '${ActivityFiles.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  BucketName:
    Value: !Ref ActivityFiles
  BucketArn:
    Value: !GetAtt ActivityFiles.Arn
