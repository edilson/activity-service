AWSTemplateFormatVersion: '2010-09-09'
Description: FIFO cycling activity queues and dead-letter queues
Resources:
  ShortRideDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-short-dlq.fifo'
      FifoQueue: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  LongRideDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-long-dlq.fifo'
      FifoQueue: true
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ShortRides:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-short.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ShortRideDeadLetters.Arn
        maxReceiveCount: 5
  LongRides:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-long.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LongRideDeadLetters.Arn
        maxReceiveCount: 5
Outputs:
  ShortQueueUrl:
    Value: !Ref ShortRides
  LongQueueUrl:
    Value: !Ref LongRides
  ShortQueueArn:
    Value: !GetAtt ShortRides.Arn
  LongQueueArn:
    Value: !GetAtt LongRides.Arn
